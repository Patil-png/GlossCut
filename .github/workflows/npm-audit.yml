name: Dependency Audit
on: [push, pull_request]

jobs:
  audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install Dependencies (Backend)
        run: cd backend && npm install --package-lock-only
      - name: Audit Backend
        run: cd backend && npm audit --audit-level=high
      - name: Install Dependencies (Main Website)
        run: cd main-website && npm install --package-lock-only
      - name: Audit Main Website
        run: cd main-website && npm audit --audit-level=high
